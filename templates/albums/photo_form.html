{% extends 'base.html' %}
{% block title %}Upload Photo{% endblock %}
{% block content %}
<h1>Upload Photo</h1>
<form method="post" enctype="multipart/form-data" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Upload</button>
    <a href="{% url 'album_detail' album_id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Delete Album{% endblock %}
{% block content %}
<h1>Delete Album</h1>
<p>Are you sure you want to delete <strong>{{ object.title }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{% url 'album_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

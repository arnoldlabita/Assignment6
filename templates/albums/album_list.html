{% extends 'base.html' %}
{% block title %}Albums{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Albums</h1>
    <a href="{% url 'album_create' %}" class="btn btn-primary">Create Album</a>
</div>
<div class="row">
    {% for album in object_list %}
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ album.title }}</h5>
                    <p class="card-text">{{ album.description|truncatewords:20 }}</p>
                    <p class="text-muted">Owner: {{ album.owner.username }}</p>
                    <a href="{% url 'album_detail' album.pk %}" class="btn btn-sm btn-outline-secondary">View</a>
                </div>
            </div>
        </div>
    {% empty %}
        <p>No albums yet.</p>
    {% endfor %}
</div>
{% endblock %}
